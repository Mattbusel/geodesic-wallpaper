[package]
name = "geodesic-wallpaper"
version = "1.5.1"
edition = "2021"
rust-version = "1.75"
description = "Animated Windows desktop wallpaper that draws glowing geodesics flowing over curved 3D surfaces (torus, Klein bottle, pseudosphere and more), rendered with wgpu."
license = "MIT"
repository = "https://github.com/Mattbusel/geodesic-wallpaper"
homepage = "https://github.com/Mattbusel/geodesic-wallpaper"
documentation = "https://docs.rs/geodesic-wallpaper"
readme = "README.md"
keywords = ["wallpaper", "live-wallpaper", "geodesic", "wgpu", "generative-art"]
categories = ["graphics", "visualization", "rendering"]
exclude = [".github/", ".claude/", "assets/", "packaging/", "*.png", "*.gif", "*.mp4"]

[package.metadata]
msrv = "1.75.0"
platform = "windows"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

# `cargo binstall geodesic-wallpaper` downloads the prebuilt Windows zip from
# GitHub Releases instead of compiling. Windows only.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[lib]
name = "geodesic_wallpaper"
path = "src/lib.rs"

[[bin]]
name = "geodesic-wallpaper"
path = "src/main.rs"

[dependencies]
wgpu = "22"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
] }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
notify = "6"
rand = "0.8"
rayon = "1"
log = "0.4"
env_logger = "0.11"
pollster = "0.3"
raw-window-handle = "0.6"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
mlua  = { version = "0.10", optional = true, features = ["lua54", "vendored"] }

[features]
## Enable Lua-scriptable custom surfaces via the `mlua` crate.
lua = ["dep:mlua"]

[dev-dependencies]
tempfile = "3"
rand = { version = "0.8", features = ["std", "std_rng"] }
proptest = "1"


[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
