[package]
name = "geodesic-wallpaper"
version = "1.6.2"
edition = "2021"
rust-version = "1.88"
description = "Animated Windows desktop wallpaper that draws glowing geodesics flowing over curved 3D surfaces (torus, Klein bottle, pseudosphere and more), rendered with wgpu. Also renders PNGs and GIFs headless."
license = "MIT"
repository = "https://gitlab.com/mattbusel/geodesic-wallpaper"
homepage = "https://gitlab.com/mattbusel/geodesic-wallpaper"
documentation = "https://docs.rs/geodesic-wallpaper"
readme = "README.md"
keywords = ["wallpaper", "live-wallpaper", "geodesic", "wgpu", "generative-art"]
categories = ["graphics", "visualization", "rendering"]
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "benches/**/*",
    "presets/*.toml",
    "config.toml",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

# docs.rs builds on Linux for the Windows target. The `lua` feature vendors and
# compiles Lua's C sources, which fails in that cross build (it broke the 1.6.0
# and 1.6.1 docs), so docs.rs documents every feature except `lua`.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
features = ["palette"]

# `cargo binstall geodesic-wallpaper` downloads the prebuilt Windows zip from
# GitHub Releases (built by .github/workflows/release.yml) instead of
# compiling. Windows only. `{ repo }` would point at GitLab, which has no
# release files, so the URL is spelled out.
[package.metadata.binstall]
pkg-url = "https://github.com/Mattbusel/geodesic-wallpaper/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[lib]
name = "geodesic_wallpaper"
path = "src/lib.rs"

[[bin]]
name = "geodesic-wallpaper"
path = "src/main.rs"

[dependencies]
wgpu = "22"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
] }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
notify-debouncer-mini = "0.7"
rand = "0.8"
rayon = "1"
log = "0.4"
env_logger = "0.11"
pollster = "0.3"
raw-window-handle = "0.6"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "gif", "bmp", "pnm"] }
palette = { version = "0.7", optional = true, default-features = false, features = ["std"] }
mlua  = { version = "0.10", optional = true, features = ["lua54", "vendored", "send"] }
clap_complete = "4"

[features]
## Enable Lua-scriptable custom surfaces via the `mlua` crate.
lua = ["dep:mlua"]
## Conversions between `colorspace` types and the `palette` crate.
palette = ["dep:palette"]

[dev-dependencies]
tempfile = "3"
rand = { version = "0.8", features = ["std", "std_rng"] }
proptest = "1"
exmex = "0.21"
criterion = { version = "0.8", default-features = false }


[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[[bench]]
name = "simulation"
harness = false
